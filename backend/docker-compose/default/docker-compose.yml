    ports:
      - "5001:5001"
    container_name: user
    healthcheck:
      test: "curl --fail --silent localhost:5001/actuator/health/readiness | grep UP || exit 1"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    depends_on:
      #      configserver:
      #        condition: service_healthy
      mysql:
        condition: service_healthy
    deploy:

        limits:
          memory: 700m
    environment:
      SPRING_APPLICATION_NAME: "user"
      SPRING_PROFILES_ACTIVE: default
      #      SPRING_CONFIG_IMPORT: "optional:configserver:http://configserver:8071/"
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/userdb"
      DB_USERNAME: "${DB_USERNAME:?Set DB_USERNAME in .env}"
      DB_PASSWORD: "${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}"
      MAIL_USERNAME: "${MAIL_USERNAME:?Set MAIL_USERNAME in .env}"
      MAIL_PASSWORD: "${MAIL_PASSWORD:?Set MAIL_PASSWORD in .env}"
      RABBITMQ_USERNAME: "${RABBITMQ_USERNAME:?Set RABBITMQ_USERNAME in .env}"
      RABBITMQ_PASSWORD: "${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}"
      KEYCLOAK_SERVER_URL: http://keycloak:8080
      KEYCLOAK_USER_USERNAME: "${KEYCLOAK_USER_USERNAME:?Set KEYCLOAK_USER_USERNAME in .env}"
      KEYCLOAK_USER_PASSWORD: "${KEYCLOAK_USER_PASSWORD:?Set KEYCLOAK_USER_PASSWORD in .env}"
      KEYCLOAK_CLIENT_SECRET: "${KEYCLOAK_CLIENT_SECRET:?Set KEYCLOAK_CLIENT_SECRET in .env}"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eurekaserver:8070/eureka/

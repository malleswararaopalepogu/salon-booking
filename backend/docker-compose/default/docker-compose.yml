      start_period: 10s
    container_name: eurekaserver
#    environment:
#      SPRING_CONFIG_IMPORT: "configserver:http://configserver:8071/"
#    depends_on:
#      configserver:
#        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 700m
    networks:
      - zosh


  user:
